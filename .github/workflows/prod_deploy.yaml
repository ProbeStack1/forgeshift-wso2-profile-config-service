name: PROD GKE Deploy - Profile Config Service

on:
  push:
    branches:
      - forgeshift-wso2-profile-config-service
  workflow_dispatch:

env:
  PROJECT_ID: probestack-prod
  ARTIFACT_REPO: probestack-prod-apps
  ARTIFACT_REGISTRY: us-central1-docker.pkg.dev
  SERVICE_NAME: forgeshift-wso2-profile-config-service
  GKE_CLUSTER: probestack-zonal-cluster
  GKE_LOCATION: us-central1-a
  GKE_LOCATION_FLAG: --zone
  NAMESPACE: secure-production-app

jobs:
  deploy-prod-profile-config:

    if: github.ref == 'refs/heads/forgeshift-wso2-profile-config-service'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/861433193200/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@probestack-prod.iam.gserviceaccount.com
          token_format: access_token

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Install GKE auth plugin
        run: gcloud components install gke-gcloud-auth-plugin --quiet

      # The JAR is built HERE, on the runner, rather than inside the Dockerfile.
      # forge-auth-lib comes from a private Artifact Registry, and only this job
      # has credentials for it - the `Authenticate to Google Cloud` step above
      # leaves Application Default Credentials behind, which the
      # artifactregistry-maven-wagon picks up. A `mvn package` inside the image
      # build runs in a container with no credentials and cannot resolve it.
      # Same arrangement as ps-community-svc.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build JAR
        run: mvn --batch-mode --no-transfer-progress clean package -DskipTests

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            ${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
          ${{ env.GKE_LOCATION_FLAG }} ${{ env.GKE_LOCATION }} \
          --project ${{ env.PROJECT_ID }}

      - name: Deploy profile config service
        run: |
          kubectl set image deployment/${{ env.SERVICE_NAME }} \
          ${{ env.SERVICE_NAME }}=${{ env.ARTIFACT_REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REPO }}/${{ env.SERVICE_NAME }}:${{ github.sha }} \
          -n ${{ env.NAMESPACE }}

      - name: Wait for deployment rollout
        run: |
          kubectl rollout status deployment/${{ env.SERVICE_NAME }} \
          -n ${{ env.NAMESPACE }}

      # Runs only when the rollout failed, using the cluster credentials this
      # job already holds. Without it a failed rollout says nothing but
      # "exceeded its progress deadline", and the reason - the startup
      # exception - stays inside the cluster where the people who need it have
      # no access. Everything is `|| true`: this step must never be the reason
      # the job fails, it only explains a failure that already happened.
      - name: Diagnose failed rollout
        if: failure()
        run: |
          set +e
          echo "===================== PODS ====================="
          kubectl -n "$NAMESPACE" get pods -o wide | grep "$SERVICE_NAME" || true
          for p in $(kubectl -n "$NAMESPACE" get pods -o name | grep "$SERVICE_NAME"); do
            echo ""
            echo "===================== $p : CONTAINER STATE + LIMITS ====================="
            # The Containers block, not a tail of the whole describe. It carries
            # Last State / Reason / Exit Code - OOMKilled shows up here and
            # nowhere else - plus Limits and the probe settings.
            kubectl -n "$NAMESPACE" describe "$p" 2>/dev/null | sed -n "/^Containers:/,/^Conditions:/p" || true
            echo ""
            echo "===================== $p : EVENTS ====================="
            kubectl -n "$NAMESPACE" describe "$p" 2>/dev/null | sed -n "/^Events:/,\$p" || true
            echo ""
            echo "===================== $p : LOGS (current) ====================="
            kubectl -n "$NAMESPACE" logs "$p" --tail=250 2>/dev/null || true
            echo ""
            echo "===================== $p : LOGS (previous) ====================="
            kubectl -n "$NAMESPACE" logs "$p" --previous --tail=250 2>/dev/null || true
          done
          exit 0

      - name: Verify running pods
        run: |
          kubectl get pods -n ${{ env.NAMESPACE }}
