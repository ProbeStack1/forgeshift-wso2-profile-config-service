spring:
  application:
    name: forgeshift-wso2-profile-config-service
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb+srv://java-app:LszhHwotDeKBfG3a@probestack-nonprod.hdggqx.mongodb.net/probestack-wso2-forgeshift?appName=Probestack-nonprod}
      database: ${MONGODB_DATABASE:probestack-wso2-forgeshift}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /wso2/config/v1
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    com.forgeshift: INFO
    org.springframework.web: INFO
    org.mongodb.driver: WARN

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# --- App properties ---
forgeshift:
  profile-config:
    # Collection names (kept aligned with the discovery service so they share data)
    wso2-profiles-collection: wso2_profiles
    kong-konnect-profiles-collection: kong_konnect_profiles
    cloud-storage-profiles-collection: cloud_storage_profiles
    audit-collection: profile_audit_log
    tenant-config-collection: tenant_configurations
    # Verify behaviour
    verify:
      wso2-include-tenant-info: true
      timeout-seconds: 15
    # Multi-tenancy
    tenant:
      header-name: ${TENANT_HEADER:X-Partner-Id}
      default-tenant: ${DEFAULT_TENANT:probestack}
    # Audit
    audit:
      enabled: ${AUDIT_ENABLED:true}

cors:
  origins: ${CORS_ORIGINS:*}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
  allowed-headers: "*"
  exposed-headers: "*"
  allow-credentials: true
  max-age: 3600
