spring:
  application:
    name: forgeshift-wso2-profile-config-service
  autoconfigure:
    # Without this Spring Security invents an in-memory user and prints a
    # generated password at every boot - noise, and a hint at a login this
    # service does not have.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_WSO2_URI:mongodb+srv://admin_db_user:HdhPLHmhHEhxSUTa@probestack-prod.mby902c.mongodb.net/probestack-wso2-forgeshift?appName=probestack-prod}
      database: ${MONGODB_WSO2_DATABASE:probestack-wso2-forgeshift}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /wso2/config/v1
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    com.forgeshift: INFO
    org.springframework.web: INFO
    org.mongodb.driver: WARN

# ---------------------------------------------------------------- authentication
#
# Verifies the platform session token (`ps_auth_token`, RS256) against the
# platform JWKS. The browser sends the cookie on its own - it is scoped to
# `.probestack.io` - and the UI's nginx forwards it here.
#
# `enabled` is ON by default so a missing property cannot silently leave the
# service open; set FORGE_AUTHN_ENABLED=false to turn it off for a local run or
# a rollback without changing the image. Same block as ps-community-svc.
forge:
  authn:
    enabled: ${FORGE_AUTHN_ENABLED:true}
    issuer-uri: ${FORGE_AUTHN_ISSUER_URI:https://auth.probestack.io}
    audience: ${FORGE_AUTHN_AUDIENCE:probestack-api}
    jwks-uri: ${FORGE_AUTHN_JWKS_URI:https://probestack.io/admin-backend/api/public/users/context-token/jwks}
    jwks-cache-duration-hours: ${FORGE_AUTHN_JWKS_CACHE_DURATION_HOURS:24}
    connect-timeout-ms: ${FORGE_AUTHN_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${FORGE_AUTHN_READ_TIMEOUT_MS:5000}
    http-proxy: ${FORGE_AUTHN_HTTP_PROXY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# --- App properties ---
forgeshift:
  profile-config:
    # Collection names (kept aligned with the discovery service so they share data)
    wso2-profiles-collection: wso2_profiles
    kong-konnect-profiles-collection: kong_konnect_profiles
    cloud-storage-profiles-collection: cloud_storage_profiles
    audit-collection: profile_audit_log
    tenant-config-collection: tenant_configurations
    # Verify behaviour
    verify:
      wso2-include-tenant-info: true
      timeout-seconds: 15
    # Multi-tenancy
    tenant:
      header-name: ${TENANT_HEADER:X-Partner-Id}
      default-tenant: ${DEFAULT_TENANT:probestack}
    # Audit
    audit:
      enabled: ${AUDIT_ENABLED:true}

cors:
  origins: ${CORS_ORIGINS:*}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
  allowed-headers: "*"
  exposed-headers: "*"
  allow-credentials: true
  max-age: 3600
