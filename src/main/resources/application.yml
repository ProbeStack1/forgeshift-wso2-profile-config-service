spring:
  application:
    name: forgeshift-wso2-profile-config-service
  autoconfigure:
    # Without this Spring Security invents an in-memory user and prints a
    # generated password at every boot - noise, and a hint at a login this
    # service does not have.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import:
      - optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  data:
    mongodb:
      uri: ${MONGODB_WSO2_URI:mongodb+srv://admin_db_user:HdhPLHmhHEhxSUTa@probestack-prod.mby902c.mongodb.net/probestack-wso2-forgeshift?appName=probestack-prod}
      database: ${MONGODB_WSO2_DATABASE:probestack-wso2-forgeshift}
      auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8082}
  servlet:
    context-path: /wso2/config/v1
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    com.forgeshift: INFO
    org.springframework.web: INFO
    org.mongodb.driver: WARN
    # forge-logging-lib's one-line-per-request summary is logged at INFO.
    com.forge.logging: INFO

# ---------------------------------------------------------------- authentication
#
# Verifies the platform session token (`ps_auth_token`, RS256) against the
# platform JWKS. The browser sends the cookie on its own - it is scoped to
# `.probestack.io` - and the UI's nginx forwards it here.
#
# `enabled` is ON by default so a missing property cannot silently leave the
# service open; set FORGE_AUTHN_ENABLED=false to turn it off for a local run or
# a rollback without changing the image. Same block as ps-community-svc.
forge:
  authn:
    enabled: ${FORGE_AUTHN_ENABLED:true}
    issuer-uri: ${FORGE_AUTHN_ISSUER_URI:https://auth.probestack.io}
    audience: ${FORGE_AUTHN_AUDIENCE:probestack-api}
    jwks-uri: ${FORGE_AUTHN_JWKS_URI:https://probestack.io/admin-backend/api/public/users/context-token/jwks}
    jwks-cache-duration-hours: ${FORGE_AUTHN_JWKS_CACHE_DURATION_HOURS:24}
    connect-timeout-ms: ${FORGE_AUTHN_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${FORGE_AUTHN_READ_TIMEOUT_MS:5000}
    http-proxy: ${FORGE_AUTHN_HTTP_PROXY:}

  # -------------------------------------------------------------- request logging
  #
  # forge-logging-lib, configured as forgecrux-token-demo-service configures it.
  # After every request it writes one line:
  #
  #   type=serviceRequest | serviceTransactionId=… | requestURI=… | httpMethod=…
  #   | httpStatusCode=… | status=SUCCESS|FAILURE | processingTimeInMillis=…
  #   | requestBody=… | responseBody=… | headers=…
  #
  # The transaction id is the caller's `activity-id` header or a new UUID, and is
  # returned as the `service-transaction-id` response header.
  #
  # This service holds credentials, so the masks are the point of this block. The
  # library masks a JSON field only when its name matches exactly (case aside) -
  # `secret` does not cover `clientSecret` - so every field that carries one is
  # named: password, clientSecret, konnectPat, pat and serviceAccountJsonBase64.
  # They are masked in responses too, as a net: no response carries a stored
  # credential - the Kong and Git profile APIs answer konnectPatStored / patStored
  # ("***") - but one that did would otherwise be logged in clear. A new credential
  # field would be logged in clear until added to both lists; RequestLogMaskingTest
  # fails first. The demo's generic five stay as a net.
  #
  # Where else this differs from the demo, on purpose:
  #  - Paths carry the context path. The library matches the raw URI, which starts
  #    with /wso2/config/v1 here, so the demo's `/actuator/**` would never match
  #    and the readiness and liveness probes would each log a line every few seconds.
  #  - The demo's partial masks (card, SSN, account number) match no field here.
  #
  # It runs after the security chain (order 10, the library's default), so a
  # request rejected with 401 gets no line - only forge-auth-lib's own WARN with
  # the path and the reason. And a JSON request body over 64 KB reaches the
  # controller cut short while it is on - the library's buffer caps what the app
  # reads, not just what it logs. This service's bodies are a few KB, and the
  # service-account upload is multipart, which the library never buffers.
  logging:
    enabled: ${FORGE_LOGGING_ENABLED:true}
    exclude-endpoints: /wso2/config/v1/actuator/**,/wso2/config/v1/v3/api-docs/**,/wso2/config/v1/swagger-ui/**
    exclude-request-endpoints: ""
    exclude-response-endpoints: ""
    mask-header-keys: Authorization,Cookie,X-API-Key,X-Auth-Token
    mask-request-keys: password,clientSecret,konnectPat,pat,serviceAccountJsonBase64,secret,token,apiKey,privateKey
    mask-response-keys: password,clientSecret,konnectPat,pat,serviceAccountJsonBase64,secret,token,apiKey,privateKey
    json-log-format: false
    masking-logs-enabled: true
    filter-order: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# --- App properties ---
forgeshift:
  profile-config:
    # Collection names (kept aligned with the discovery service so they share data)
    wso2-profiles-collection: wso2_profiles
    kong-konnect-profiles-collection: kong_konnect_profiles
    cloud-storage-profiles-collection: cloud_storage_profiles
    audit-collection: profile_audit_log
    tenant-config-collection: tenant_configurations
    # Verify behaviour
    verify:
      wso2-include-tenant-info: true
      timeout-seconds: 15
    # Multi-tenancy
    tenant:
      header-name: ${TENANT_HEADER:X-Partner-Id}
      default-tenant: ${DEFAULT_TENANT:probestack}
    # Audit
    audit:
      enabled: ${AUDIT_ENABLED:true}

cors:
  origins: ${CORS_ORIGINS:*}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
  allowed-headers: "*"
  exposed-headers: "*"
  allow-credentials: true
  max-age: 3600
